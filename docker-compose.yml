services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: puzzlearena
    ports:
      - "5433:5432"
    volumes:
      - puzzlearena_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d puzzlearena"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  puzzlearena_pgdata:
